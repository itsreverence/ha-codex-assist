name: Bug report
description: Report a Codex Assist problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please do not paste access tokens, refresh tokens, cookies, or Home Assistant secrets.
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      placeholder: "2026.6.0"
    validations:
      required: true
  - type: input
    id: integration-version
    attributes:
      label: Codex Assist version / commit
      placeholder: "The version shown in HACS, or a commit SHA"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Problem area
      options:
        - Setup / device-code sign-in
        - Token refresh / reauth
        - Assist pipeline selection
        - Exposed entity control
        - Hosted web search
        - AI Task or image attachments
        - Model list or model selection
        - Model response quality
        - HACS install/update
        - Other
    validations:
      required: true
  - type: input
    id: model-settings
    attributes:
      label: Selected model and hosted web search setting
      description: Optional. The chat model chosen in Codex Assist options and whether hosted web search is on.
      placeholder: "Model name, search on or off"
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Home Assistant logs
      description: Paste only relevant redacted log lines containing codex_assist. Review any downloaded diagnostics before attaching them. Remove tokens, device codes, private URLs, and private entity names.
      render: text
