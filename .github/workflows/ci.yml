name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly run to catch regressions in the pinned Home Assistant contracts,
    # hassfest rule changes, and HACS validation changes.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: Tests and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        # setup-uv v8+ no longer publishes major tags (@v8); pin a full immutable tag.
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run tests
        run: uv run pytest -q

      - name: Check that tests catch recorded mutations
        run: uv run python scripts/check_mutations.py --suite fast

      - name: Run Ruff
        run: uv run ruff check .

  ha-smoke:
    name: Home Assistant 2026.9 stable contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install Home Assistant test environment
        run: pip install -r requirements_test_ha_202609.txt

      - name: Run smoke tests against real Home Assistant
        run: python -m pytest tests_ha -q

  ha-current:
    name: Home Assistant 2026.10 stable contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install current Home Assistant test environment
        run: |
          uv venv --python 3.14 .venv-ha
          uv pip install --python .venv-ha/bin/python -r requirements_test_ha.txt \
            --override requirements_test_ha_overrides.txt

      - name: Verify current Home Assistant
        run: .venv-ha/bin/python -m pytest tests_ha -q

      - name: Check that tests catch recorded AI Task mutations
        run: .venv-ha/bin/python scripts/check_mutations.py --suite ha

  ha-minimum:
    name: Home Assistant 2026.6 contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install minimum Home Assistant test environment
        run: pip install -r requirements_test_ha_min.txt

      - name: Run contract tests against minimum Home Assistant
        run: python -m pytest tests_ha -q

      - name: Install Probatio alongside the legacy converter
        run: pip install probatio==0.11.2

      - name: Verify minimum Home Assistant with both converters installed
        run: python -m pytest tests_ha -q

  ha-previous:
    name: Home Assistant 2026.8 contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install previous Home Assistant test environment
        run: pip install -r requirements_test_ha_previous.txt

      - name: Verify previous Home Assistant
        run: python -m pytest tests_ha -q

      - name: Install Probatio alongside the legacy converter
        run: pip install probatio==0.11.2

      - name: Verify previous Home Assistant with both converters installed
        run: python -m pytest tests_ha -q

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          comment: false
