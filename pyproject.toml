[project]
name = "ha-codex-assist"
version = "0.6.0-beta.1"
description = "Home Assistant Assist conversation agent backed by OpenAI Codex OAuth"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Codex Assist contributors" }]
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Home Assistant 2026.11+ aliases httpx to httpx2 at import; respx's pytest
# plugin would import httpx first. The suites do not use its fixtures.
addopts = "-p no:respx"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
